# Copyright (c) 2023
name: M520

on:
  schedule:
    - cron: '0 0 * * *'
  release:
    types: [published]
  push:
    branches:
      - master
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: "Enable SSH connection to Actions"
        required: false
        default: "false"
  watch:
    types: [started]

permissions:
  contents: write

env:
  REPO_URL: https://github.com/x-wrt/x-wrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config-m520
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Ho_Chi_Minh
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CUSTOM_99: 99-network-custom.sh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Init environment
      # =========================
      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake git wget curl \
            python3 python3-distutils python3-setuptools \
            rsync unzip file \
            libncurses5-dev libssl-dev zlib1g-dev \
            gawk gettext flex bison \
            gcc-multilib g++-multilib

          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      # =========================
      # Clone source
      # =========================
      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      # =========================
      # Load custom scripts
      # =========================
      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

          git fetch --tags
          latest_tag=$(git describe --tags $(git rev-list --tags --max-count=1))
          git checkout -f $latest_tag

      # =========================
      # Feeds
      # =========================
      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      # =========================
      # Inject files (FIXED CORE PART)
      # =========================
      - name: Inject custom files
        run: |
          if [ -d "files" ]; then
            echo "Injecting files into OpenWrt..."
            rsync -a files/ openwrt/files/
          fi

          mkdir -p openwrt/files/etc/uci-defaults
          mv -f $CUSTOM_99 openwrt/files/etc/uci-defaults/99-custom || true

      # =========================
      # Custom config
      # =========================
      - name: Load configuration
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      # =========================
      # SSH debug
      # =========================
      - name: Enable SSH connection
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true'

      # =========================
      # Download deps
      # =========================
      - name: Download packages
        run: |
          cd openwrt
          make defconfig
          make download -j$(nproc)

      # =========================
      # Build firmware
      # =========================
      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # =========================
      # Collect firmware
      # =========================
      - name: Organize firmware
        run: |
          target=$(find openwrt/bin/targets -type f -name "*sysupgrade*.bin" | head -n 1)
          mkdir -p firmware
          cp $target firmware/

          echo "FIRMWARE=$(pwd)/firmware" >> $GITHUB_ENV

      # =========================
      # Upload artifact
      # =========================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: M520-firmware
          path: firmware

      # =========================
      # Release
      # =========================
      - name: Generate tag
        id: tag
        run: |
          echo "tag=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
